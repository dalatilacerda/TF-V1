<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Envio de Ticket - Time</title>
    <style>
      /* Fundo abstrato suave */
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #f3f7ff 0%, #fff8fe 100%);
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        color: #111;
      }

      /* Container Glassmórfico */
      .form-container {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        padding: 40px 30px;
        width: 100%;
        max-width: 360px;
      }

      h3 {
        font-size: 20px;
        font-weight: 700;
        margin-top: 0;
        text-align: center;
        margin-bottom: 30px;
      }
      label {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: block;
        margin-top: 20px;
        color: #666;
      }

      /* Input do Ticket Estilo Clean */
      .ticket-input-container {
        display: flex;
        align-items: center;
        margin-top: 8px;
        border-bottom: 1px solid #111;
        background: transparent;
      }
      .ticket-prefix {
        padding: 8px 0 8px 4px;
        color: #111;
        font-weight: 500;
        font-size: 16px;
        user-select: none;
      }
      .ticket-input-container input {
        border: none;
        width: 100%;
        padding: 8px 4px;
        font-size: 16px;
        outline: none;
        background: transparent;
        color: #111;
      }

      /* Input da Fila Estilo Clean */
      input[list] {
        width: 100%;
        padding: 10px 4px;
        margin-top: 8px;
        border: none;
        border-bottom: 1px solid #111;
        box-sizing: border-box;
        font-size: 16px;
        outline: none;
        background: transparent;
        color: #111;
      }
      input[list]::placeholder {
        color: #aaa;
      }

      /* Botão Minimalista Monocromático */
      button {
        width: 100%;
        padding: 14px;
        background-color: #111111;
        color: #ffffff;
        border: 1px solid #111111;
        border-radius: 8px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 13px;
        margin-top: 35px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      button:hover {
        background-color: #ffffff;
        color: #111111;
      }

      .back-link {
        display: block;
        text-align: center;
        margin-top: 25px;
        color: #888;
        text-decoration: none;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        transition: color 0.2s;
      }
      .back-link:hover {
        color: #111;
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <h3>Operador</h3>

      <label for="ticketId">Número do Ticket</label>
      <div class="ticket-input-container">
        <span class="ticket-prefix">#</span>
        <input
          type="text"
          id="ticketId"
          inputmode="numeric"
          pattern="[0-9]*"
          placeholder="1234567"
          oninput="this.value = this.value.replace(/[^0-9]/g, '')"
        />
      </div>

      <label for="filaDestino">Fila de Destino</label>
      <input list="filas" id="filaDestino" placeholder="Buscar fila..." />
      <datalist id="filas">
        <option value="Reabertura"></option>
        <option value="Estácio Graduação - Transbordo SM"></option>
        <option value="Estácio Graduação - Funil Ativo"></option>
        <option value="Estácio Graduação - Funil Receptivo"></option>
        <option value="Estácio Graduação - Leads Ativo"></option>
        <option value="CT - Funil Receptivo"></option>
        <option value="CT - Lead Receptivo"></option>
        <option value="CTW - Estácio Graduação"></option>
        <option value="CTW - Pós Estácio"></option>
        <option value="Default"></option>
        <option value="Estácio Funil Receptivo"></option>
        <option value="Estácio Graduação - site"></option>
        <option value="Estácio Graduação - Leads Receptivo"></option>
        <option value="Estácio Pós Graduação - Funil Ativo"></option>
        <option value="Estácio Pós Graduação - Funil Receptivo"></option>
        <option value="Estácio Pós Graduação - Leads Ativo"></option>
        <option value="Estácio Pós Graduação - Leads Receptivo"></option>
        <option value="Rota de Sucesso"></option>
      </datalist>

      <button type="button" onclick="enviarParaSuper()">Enviar Ticket</button>

      <a href="index.html" class="back-link">← Voltar</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://hyblabgajydpwfdctiar.supabase.co";
      const SUPABASE_KEY = "sb_publishable_yOPlQaFVe467_MnpfXjJow_9bcS9XTt";
      const bancoSupabase = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      async function enviarParaSuper() {
        try {
          const ticketNumero = document.getElementById("ticketId").value.trim();
          const fila = document.getElementById("filaDestino").value.trim();

          // Validação: verifica se a fila foi escolhida e se o ticket tem EXATAMENTE 6 dígitos
          if (ticketNumero.length !== 7 || !fila) {
            alert(
              "Por favor, selecione a fila e insira um número de ticket válido com exatamente 6 dígitos!"
            );
            return;
          }

          const ticketFormatado = "#" + ticketNumero;

          const { error } = await bancoSupabase.from("tickets").insert([
            {
              operador: "Operador",
              ticket: ticketFormatado,
              fila: fila,
              obs: "",
              hora: new Date().toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit",
              }),
            },
          ]);

          if (error) {
            alert("Erro ao enviar: " + error.message);
          } else {
            alert("Enviado com sucesso!");
            document.getElementById("ticketId").value = "";
            document.getElementById("filaDestino").value = "";
          }
        } catch (err) {
          alert("Erro inesperado: " + err.message);
        }
      }
    </script>
  </body>
</html>
