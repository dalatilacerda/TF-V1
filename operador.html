<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Envio de Ticket - Time</title>
    <style>
      /* Fundo abstrato suave */
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #f3f7ff 0%, #fff8fe 100%);
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        color: #111;
      }

      /* Container Glassmórfico */
      .form-container {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        padding: 40px 30px;
        width: 100%;
        max-width: 360px;
      }

      h3 {
        font-size: 20px;
        font-weight: 700;
        margin-top: 0;
        text-align: center;
        margin-bottom: 30px;
      }
      label {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: block;
        margin-top: 20px;
        color: #666;
      }

      /* Campo Textarea adaptado para múltiplos tickets com # */
      .ticket-input-container {
        display: flex;
        flex-direction: column;
        margin-top: 8px;
        border-bottom: 1px solid #111;
        background: transparent;
      }
      .ticket-input-container textarea {
        border: none;
        width: 100%;
        height: 80px;
        padding: 8px 4px;
        font-size: 15px;
        font-family: inherit;
        outline: none;
        background: transparent;
        color: #111;
        resize: none;
      }
      .ticket-input-container textarea::placeholder {
        color: #aaa;
      }

      /* Input da Fila Estilo Clean */
      input[list] {
        width: 100%;
        padding: 10px 4px;
        margin-top: 8px;
        border: none;
        border-bottom: 1px solid #111;
        box-sizing: border-box;
        font-size: 16px;
        outline: none;
        background: transparent;
        color: #111;
      }
      input[list]::placeholder {
        color: #aaa;
      }

      /* Botão Minimalista Monocromático */
      button {
        width: 100%;
        padding: 14px;
        background-color: #111111;
        color: #ffffff;
        border: 1px solid #111111;
        border-radius: 8px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 13px;
        margin-top: 35px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      button:hover {
        background-color: #ffffff;
        color: #111111;
      }

      button:disabled {
        background-color: #666;
        border-color: #666;
        cursor: not-allowed;
      }

      .back-link {
        display: block;
        text-align: center;
        margin-top: 25px;
        color: #888;
        text-decoration: none;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        transition: color 0.2s;
      }
      .back-link:hover {
        color: #111;
      }

      /* Balão de notificação moderna (Toast) */
      .toast-notification {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: #111;
        color: #fff;
        padding: 12px 24px;
        border-radius: 30px;
        font-size: 14px;
        font-weight: 500;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        z-index: 10000;
        white-space: nowrap;
      }
      .toast-notification.show {
        transform: translateX(-50%) translateY(0);
      }
      .toast-error {
        background: #e63946;
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <h3>Operador</h3>

      <label for="ticketId">Tickets</label>
      <div class="ticket-input-container">
        <textarea
          id="ticketId"
          placeholder="Cole aqui os tickets acompanhados de # (Ex: #1234567 #8901234...)"
        ></textarea>
      </div>

      <label for="filaDestino">Fila de Destino</label>
      <input list="filas" id="filaDestino" placeholder="Buscar fila..." />
      <datalist id="filas">
        <option value="Reabertura"></option>
        <option value="Estácio Graduação - Transbordo SM"></option>
        <option value="Estácio Graduação - Funil Ativo"></option>
        <option value="Estácio Graduação - Funil Receptivo"></option>
        <option value="Estácio Graduação - Leads Ativo"></option>
        <option value="CT - Funil Receptivo"></option>
        <option value="CT - Lead Receptivo"></option>
        <option value="CTW - Estácio Graduação"></option>
        <option value="CTW - Pós Estácio"></option>
        <option value="Default"></option>
        <option value="Estácio Funil Receptivo"></option>
        <option value="Estácio Graduação - site"></option>
        <option value="Estácio Graduação - Leads Receptivo"></option>
        <option value="Estácio Pós Graduação - Funil Ativo"></option>
        <option value="Estácio Pós Graduação - Funil Receptivo"></option>
        <option value="Estácio Pós Graduação - Leads Ativo"></option>
        <option value="Estácio Pós Graduação - Leads Receptivo"></option>
        <option value="Rota de Sucesso"></option>
      </datalist>

      <button type="button" id="submitBtn" onclick="enviarParaSuper()">
        Enviar Tickets
      </button>

      <a href="index.html" class="back-link">← Voltar</a>
    </div>

    <div id="toast" class="toast-notification"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://hyblabgajydpwfdctiar.supabase.co";
      const SUPABASE_KEY = "sb_publishable_yOPlQaFVe467_MnpfXjJow_9bcS9XTt";
      const bancoSupabase = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      function mostrarAviso(mensagem, ehErro = false) {
        const toast = document.getElementById("toast");
        toast.textContent = mensaje = mensagem;
        if (ehErro) {
          toast.classList.add("toast-error");
        } else {
          toast.classList.remove("toast-error");
        }
        toast.classList.add("show");
        setTimeout(() => {
          toast.classList.remove("show");
        }, 3000);
      }

      async function enviarParaSuper() {
        const btn = document.getElementById("submitBtn");
        try {
          const textoBruto = document.getElementById("ticketId").value;
          const fila = document.getElementById("filaDestino").value.trim();

          // Regex que captura apenas os números de qualquer sequência que contenha dígitos
          const regexNumeros = /\d+/g;
          const matches = textoBruto.match(regexNumeros) || [];

          // Limpa duplicados e pega apenas números válidos (geralmente com 7 caracteres com base na validação anterior)
          const listaTickets = matches
            .map((t) => t.trim())
            .filter((t) => t.length > 0);

          if (listaTickets.length === 0 || !fila) {
            mostrarAviso(
              "Selecione a fila e insira pelo menos um ticket válido!",
              true
            );
            return;
          }

          btn.disabled = true;
          btn.textContent = "Enviando Lote...";

          // Cria a lista estruturada de objetos prontos para injeção múltipla no Supabase
          const registrosParaInserir = listaTickets.map((ticketNumero) => {
            return {
              operador: "Operador",
              ticket: "#" + ticketNumero,
              fila: fila,
              obs: "",
              hora: new Date().toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit",
              }),
            };
          });

          // Envia o array inteiro de uma só vez (Operação Bulk)
          const { error } = await bancoSupabase
            .from("tickets")
            .insert(registrosParaInserir);

          if (error) {
            mostrarAviso("Erro ao enviar: " + error.message, true);
          } else {
            mostrarAviso(
              `Sucesso! ${listaTickets.length} ticket(s) enviado(s).`
            );
            document.getElementById("ticketId").value = "";
            document.getElementById("filaDestino").value = "";
          }
        } catch (err) {
          mostrarAviso("Erro inesperado: " + err.message, true);
        } finally {
          btn.disabled = false;
          btn.textContent = "Enviar Tickets";
        }
      }
    </script>
  </body>
</html>
