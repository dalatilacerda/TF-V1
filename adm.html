<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Triagem - Blip</title>
    <style>
      /* Fundo abstrato suave para o efeito de desfoque */
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #f3f7ff 0%, #fff8fe 100%);
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
        color: #111;
      }

      .main-container {
        width: 100%;
        max-width: 600px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Título Principal */
      h1 {
        font-size: 32px;
        font-weight: 700;
        color: #111;
        margin-bottom: 50px;
      }

      /* Container dos Cartões */
      .cards-container {
        display: flex;
        gap: 20px;
        width: 100%;
      }

      /* Cartões Glassmórficos (inspirados no seu print) */
      .portal-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        padding: 30px;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        color: #111;
        flex: 1;
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .portal-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
      }

      /* Ícone de Usuário (simplificado em texto) */
      .card-icon {
        width: 60px;
        height: 60px;
        background: rgba(0, 0, 0, 0.05);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        font-size: 24px;
        color: #666;
        font-weight: 500;
      }

      .card-title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .card-desc {
        font-size: 13px;
        color: #666;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <h1>Portal de Triagem</h1>

      <div class="cards-container">
        <a href="operador.html" class="portal-card">
          <div class="card-icon">Op</div>
          <div class="card-title">Acesso Operador</div>
          <div class="card-desc">
            Área para envio de tickets para a supervisão.
          </div>
        </a>

        <a href="supervisor.html" class="portal-card">
          <div class="card-icon">Sv</div>
          <div class="card-title">Acesso Supervisor</div>
          <div class="card-desc">
            Visualize e gerencie a fila de tickets em tempo real.
          </div>
        </a>
      </div>
    </div>
  </body>
</html>
