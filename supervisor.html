<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel da Supervisão</title>
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background-color: #f0f2f5;
        margin: 0;
        padding: 20px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #ddd;
        padding-bottom: 10px;
        margin-bottom: 20px;
      }
      h2 {
        color: #1e6bee;
        margin: 0;
      }
      .grid-tickets {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
      }
      .card-ticket {
        background: white;
        border-left: 5px solid #1e6bee;
        border-radius: 6px;
        padding: 15px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        position: relative;
      }
      .card-header {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #777;
        margin-bottom: 10px;
      }
      .ticket-info {
        font-size: 16px;
        font-weight: bold;
        color: #333;
        margin-bottom: 10px;
        background: #f9f9f9;
        padding: 8px;
        border-radius: 4px;
        word-break: break-all;
      }
      .btn-copy {
        background-color: #1e6bee;
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
        margin-top: 10px;
      }
      .btn-copy:hover {
        background-color: #1552b8;
      }
      .btn-done {
        background-color: #e0e0e0;
        color: #555;
        border: none;
        padding: 5px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        position: absolute;
        top: 15px;
        right: 15px;
      }
      .btn-done:hover {
        background-color: #d4d4d4;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h2>Fila de Triagem da Super</h2>
      <a
        href="index.html"
        style="text-decoration: none; color: #1e6bee; font-weight: bold"
        >← Sair</a
      >
    </div>

    <div class="grid-tickets" id="listaTickets"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      // Suas chaves oficiais configuradas
      const SUPABASE_URL = "https://hyblabgajydpwfdctiar.supabase.co";
      const SUPABASE_KEY = "sb_publishable_yOPlQaFVe467_MnpfXjJow_9bcS9XTt";

      // Conecta com o Supabase
      const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      let cardsExibidos = new Set();

      // Desenha o card do ticket na tela da supervisora
      function renderizarCard(dados) {
        if (cardsExibidos.has(dados.id)) return;

        const container = document.getElementById("listaTickets");

        // Remove texto de lista vazia no primeiro ticket
        if (cardsExibidos.size === 0) container.innerHTML = "";

        const cardHTML = `
            <div class="card-ticket" id="card-${dados.id}">
                <div class="card-header">
                    <span>De: <b>${dados.operador}</b></span>
                    <span>${dados.hora}</span>
                </div>
                <div style="margin-bottom: 5px;">Para Fila: <span style="background: #ffe600; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 12px;">${dados.fila}</span></div>
                <div class="ticket-info" id="text-${dados.id}">${dados.ticket}</div>
                <div style="font-size: 13px; color:#555;"><i>"${dados.obs}"</i></div>
                <button class="btn-copy" onclick="copiarTexto('text-${dados.id}')">Copiar ID</button>
                <button class="btn-done" onclick="removerCard(${dados.id})">Resolvido</button>
            </div>
        `;

        container.insertAdjacentHTML("afterbegin", cardHTML);
        cardsExibidos.add(dados.id);
      }

      // Carrega os tickets existentes na abertura da página
      async function carregarTicketsIniciais() {
        const { data, error } = await supabase
          .from("tickets")
          .select("*")
          .order("id", { ascending: true });

        if (data && data.length > 0) {
          data.forEach((ticket) => renderizarCard(ticket));
        } else {
          document.getElementById("listaTickets").innerHTML =
            '<p id="sem-tickets" style="color: #777; text-align: center; grid-column: 1/-1;">Nenhum ticket na fila no momento.</p>';
        }
      }

      // ESCUTA EM TEMPO REAL: Se um operador enviar um ticket, ele brota na tela na mesma hora
      supabase
        .channel("schema-db-changes")
        .on(
          "postgres_changes",
          { event: "INSERT", schema: "public", table: "tickets" },
          (payload) => {
            renderizarCard(payload.new);
          }
        )
        .subscribe();

      // Copia o ID para a área de transferência com feedback visual de sucesso
      function copiarTexto(idElemento) {
        const texto = document.getElementById(idElemento).innerText;
        navigator.clipboard.writeText(texto);

        const botao = document.querySelector(
          `button[onclick="copiarTexto('${idElemento}')"]`
        );
        const textoOriginal = botao.innerText;
        botao.innerText = "✓ Copiado!";
        botao.style.backgroundColor = "#25d366";

        setTimeout(() => {
          botao.innerText = textoOriginal;
          botao.style.backgroundColor = "#1e6bee";
        }, 1500);
      }

      // Deleta o card e remove do banco de dados global
      async function removerCard(idTicket) {
        await supabase.from("tickets").delete().eq("id", idTicket);

        document.getElementById(`card-${idTicket}`).remove();
        cardsExibidos.delete(idTicket);

        if (cardsExibidos.size === 0) {
          document.getElementById("listaTickets").innerHTML =
            '<p id="sem-tickets" style="color: #777; text-align: center; grid-column: 1/-1;">Nenhum ticket na fila no momento.</p>';
        }
      }

      // Inicia o processo de listagem
      carregarTicketsIniciais();
    </script>
  </body>
</html>
