<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel da Supervisão</title>
    <style>
      /* Fundo abstrato suave */
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #f3f7ff 0%, #fff8fe 100%);
        margin: 0;
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        color: #111;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* Header Estilo Glass */
      .header {
        width: 100%;
        max-width: 550px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #111;
        padding-bottom: 15px;
        margin-bottom: 30px;
      }
      h2 {
        font-size: 18px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin: 0;
      }
      .back-link {
        text-decoration: none;
        color: #888;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        transition: color 0.2s;
      }
      .back-link:hover {
        color: #111;
      }

      /* Container da Fila */
      .fila-container {
        width: 100%;
        max-width: 550px;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      /* Cartões de Ticket Glassmórficos (inspirados no seu print) */
      .ticket-linha {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      }
      .ticket-linha:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.07);
        border-color: #111;
      }

      .ticket-info-central {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .ticket-numero {
        font-size: 24px;
        font-weight: 700;
        color: #111;
        letter-spacing: -0.5px;
      }

      /* Etiqueta de Fila (adaptado da estética Portais do print) */
      .ticket-fila {
        font-size: 11px;
        color: #666;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        background: rgba(0, 0, 0, 0.05);
        padding: 4px 10px;
        border-radius: 6px;
        width: fit-content;
      }

      /* Botão Minimalista da Super */
      .btn-copy {
        background-color: #ffffff;
        color: #111111;
        border: 1px solid #111111;
        padding: 11px 20px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition: all 0.2s ease;
        min-width: 120px;
        text-align: center;
      }
      .btn-copy:hover {
        background-color: #111111;
        color: #ffffff;
      }

      #sem-tickets {
        color: #888;
        text-align: center;
        padding: 60px;
        font-style: italic;
        font-size: 14px;
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h2>Fila de Triagem</h2>
      <a href="index.html" class="back-link">Sair →</a>
    </div>

    <div class="fila-container" id="listaTickets"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://hyblabgajydpwfdctiar.supabase.co";
      const SUPABASE_KEY = "sb_publishable_yOPlQaFVe467_MnpfXjJow_9bcS9XTt";
      const bancoSupabase = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );
      let cardsExibidos = new Set();

      function renderizarLinhaTicket(dados) {
        if (cardsExibidos.has(dados.id)) return;

        const container = document.getElementById("listaTickets");
        if (cardsExibidos.size === 0) container.innerHTML = "";

        const linhaHTML = `
            <div class="ticket-linha" id="ticket-${dados.id}">
                <div class="ticket-info-central">
                    <span class="ticket-numero" id="text-num-${dados.id}">${dados.ticket}</span>
                    <span class="ticket-fila" id="text-fila-${dados.id}">${dados.fila}</span>
                </div>
                <button class="btn-copy" onclick="tratarCopiarEConcluir('${dados.id}')">Copiar Dados</button>
            </div>
        `;

        // Adiciona novos tickets no final da fila (ordem de chegada)
        container.insertAdjacentHTML("beforeend", linhaHTML);
        cardsExibidos.add(dados.id);
      }

      async function carregarFilaInicial() {
        try {
          const { data, error } = await bancoSupabase
            .from("tickets")
            .select("*")
            .order("id", { ascending: true });

          if (data && data.length > 0) {
            data.forEach((ticket) => renderizarLinhaTicket(ticket));
          } else {
            mostrarMensagemVazia();
          }
        } catch (err) {
          console.error(err);
        }
      }

      // Tempo Real Integrado
      bancoSupabase
        .channel("schema-db-changes")
        .on(
          "postgres_changes",
          { event: "INSERT", schema: "public", table: "tickets" },
          (payload) => {
            renderizarLinhaTicket(payload.new);
          }
        )
        .subscribe();

      async function tratarCopiarEConcluir(idTicket) {
        const numeroTicket = document.getElementById(
          `text-num-${idTicket}`
        ).innerText;
        const nomeFila = document.getElementById(
          `text-fila-${idTicket}`
        ).innerText;

        const textoParaCopiar = `Ticket: ${numeroTicket} | Fila: ${nomeFila}`;
        navigator.clipboard.writeText(textoParaCopiar);

        const botao = document.querySelector(`#ticket-${idTicket} .btn-copy`);
        botao.innerText = "Copiado";
        botao.style.backgroundColor = "#111111";
        botao.style.color = "#ffffff";

        setTimeout(async () => {
          await bancoSupabase.from("tickets").delete().eq("id", idTicket);

          const elemento = document.getElementById(`ticket-${idTicket}`);
          if (elemento) elemento.remove();
          cardsExibidos.delete(idTicket);

          if (cardsExibidos.size === 0) {
            mostrarMensagemVazia();
          }
        }, 300);
      }

      function mostrarMensagemVazia() {
        document.getElementById("listaTickets").innerHTML =
          '<p id="sem-tickets">Fila vazia.</p>';
      }

      carregarFilaInicial();
    </script>
  </body>
</html>
